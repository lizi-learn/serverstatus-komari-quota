name: Build Theme Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to receive the package
        required: true
        default: v1.0.18

permissions:
  contents: write

concurrency:
  group: theme-release-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build package
        run: npm run -s pack

      - name: Validate package
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./komari-theme.json').version")
          PACKAGE="ServerStatus-v${VERSION}.zip"

          if [[ "$RELEASE_TAG" != "$VERSION" && "$RELEASE_TAG" != "v$VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match theme version $VERSION." >&2
            exit 1
          fi

          test -f "$PACKAGE"
          unzip -Z1 "$PACKAGE" | grep -Fxq "komari-theme.json"
          unzip -Z1 "$PACKAGE" | grep -Fxq "preview.png"
          unzip -Z1 "$PACKAGE" | grep -Fxq "dist/index.html"
          echo "PACKAGE=$PACKAGE" >> "$GITHUB_ENV"

      - name: Upload package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" "$PACKAGE" --repo "$GITHUB_REPOSITORY" --clobber
